name: Deploy Azure Static Web App
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: swa-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build e Deploy (Azure)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e buildar
        env:
          VITE_SUPABASE_URL: https://api.xptoinc.com.br
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bmZpZnhpcXZ6dGN3ZWdheW9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODg0MjEsImV4cCI6MjEwMjM2NDQyMX0.1RQNgYjj9Zhg4YOm9m0kKTQ7Sk3MYemJ_bXOFoXVE1U
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Garantir config SPA + headers de seguranca
        run: |
          cat > dist/staticwebapp.config.json <<'JSON'
          {
            "navigationFallback": { "rewrite": "/index.html", "exclude": ["/assets/*", "*.{png,jpg,gif,svg,ico,js,css,woff,woff2}"] },
            "globalHeaders": {
              "Strict-Transport-Security": "max-age=63072000; includeSubDomains",
              "X-Content-Type-Options": "nosniff",
              "X-Frame-Options": "SAMEORIGIN",
              "Referrer-Policy": "strict-origin-when-cross-origin",
              "X-XSS-Protection": "1; mode=block"
            }
          }
          JSON
      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Publicar no Azure Static Web Apps
        working-directory: .
        run: |
          TOKEN=$(az staticwebapp secrets list --name swa-faith --resource-group rg-xpto-plataforma --query "properties.apiKey" -o tsv)
          npm i -g @azure/static-web-apps-cli
          swa deploy frontend/dist --deployment-token "$TOKEN" --env production
